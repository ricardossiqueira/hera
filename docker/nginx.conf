server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    include /etc/nginx/conf.d/api-proxy.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
